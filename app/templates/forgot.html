{% extends "base.html" %}
{% block title %}{{ t("reset.title") }}{% endblock %}
{% block content %}
<div class="login-box">
  <h1>{{ t("reset.title") }}</h1>
  {% if not smtp %}
  <p class="muted">{{ t("reset.no_smtp") }}</p>
  {% elif sent %}
  <div class="alert alert-info">{{ t("reset.sent") }}</div>
  {% else %}
  <form method="post" action="/forgot">
    <label>{{ t("common.email") }}
      <input type="email" name="email" required autofocus>
    </label>
    <button type="submit" class="btn">{{ t("reset.send") }}</button>
  </form>
  {% endif %}
  <p class="muted"><a href="/login">← {{ t("reset.back") }}</a></p>
</div>
{% endblock %}
