# Builds the Docker image and pushes it to the GitHub Container Registry
# (ghcr.io/siliconserver/aviationlog).
#  - push to main: tags :main and :sha-<commit>
#  - called from release.yml with a version: additionally :<version> and :latest
# Tags created by release.yml with GITHUB_TOKEN do not trigger other workflows,
# so release.yml calls this workflow directly (workflow_call).
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 0.1), empty for a main build
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=AviationLog
            org.opencontainers.image.version=${{ inputs.version || 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
