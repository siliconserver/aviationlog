# Builds the desktop apps (Windows installer, macOS DMG for Apple Silicon, Debian package)
# with desktop/build.py and checks that each one starts.
#  - pull requests that touch the desktop build, or "Run workflow": build and test only,
#    the files are attached to the workflow run
#  - called from release.yml with a version: the files are also attached to the release
name: Desktop apps

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - "requirements.txt"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (e.g. 0.3), empty for a test build
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-2022
          - target: macos
            os: macos-latest # Apple Silicon (arm64)
          - target: linux
            os: ubuntu-22.04 # older glibc, so the .deb runs on Debian 12 and newer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: GTK and WebKitGTK (Linux app window)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev gir1.2-webkit2-4.1 xvfb

      - name: Install build tools
        run: python -m pip install -r requirements.txt -r desktop/requirements.txt

      - name: Inno Setup
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        id: build
        shell: bash
        run: python desktop/build.py ${{ inputs.version && format('--version {0}', inputs.version) || '' }}

      - name: Start the app (smoke test)
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            windows) exe=dist/AviationLog/AviationLog.exe ;;
            macos)   exe=dist/AviationLog.app/Contents/MacOS/AviationLog ;;
            linux)   exe=dist/AviationLog/AviationLog ;;
          esac
          python desktop/smoke_test.py "$exe"

      - name: Windows event log after a crash
        if: failure() && matrix.target == 'windows'
        shell: pwsh
        run: |
          Get-WinEvent -LogName Application -MaxEvents 40 |
            Where-Object { $_.ProviderName -match '.NET Runtime|Application Error|WebView' } |
            Format-List TimeCreated, ProviderName, Message

      - name: Diagnose the app window (Linux)
        if: failure() && matrix.target == 'linux'
        run: |
          set +e
          try() {
            echo "::group::$1"
            home=$(mktemp -d); echo '{"port": 18192}' > "$home/config.json"
            shift
            env AVIATIONLOG_HOME="$home" PYWEBVIEW_LOG=debug G_MESSAGES_DEBUG=all timeout 120 xvfb-run -a "$@" 2>&1 | grep -v "^\s*$" | tail -60
            echo "exit: ${PIPESTATUS[0]}"
            tail -20 "$home/logs/aviationlog.log"
            echo "::endgroup::"
          }
          PG=$(python -c "import pgserver, os; print(os.path.join(os.path.dirname(pgserver.__file__), 'pginstall'))")
          try "unfrozen" env AVIATIONLOG_PG_DIR="$PG" python desktop/aviationlog_desktop.py --self-test
          try "frozen, no sandbox" env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 dist/AviationLog/AviationLog --self-test
          try "frozen, no compositing" env WEBKIT_DISABLE_COMPOSITING_MODE=1 dist/AviationLog/AviationLog --self-test
          ls /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/

      - name: Check the Debian package
        if: matrix.target == 'linux'
        run: |
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test -x /opt/aviationlog/AviationLog
          desktop-file-validate /usr/share/applications/aviationlog.desktop || true

      - uses: actions/upload-artifact@v4
        with:
          name: aviationlog-${{ matrix.target }}
          path: ${{ steps.build.outputs.file }}
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # only the desktop builds; the release run also holds other artifacts (Docker build record)
          pattern: aviationlog-*
          path: files
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          ls -l files
          gh release upload "$TAG" files/* --clobber --repo "${{ github.repository }}"
