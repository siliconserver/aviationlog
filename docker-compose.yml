services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # all database files live in ./data next to this file
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Prebuilt image from the GitHub Container Registry (`docker compose pull`),
    # or build locally with `docker compose up -d --build`. Version via AVIATIONLOG_TAG in .env.
    image: ghcr.io/siliconserver/aviationlog:${AVIATIONLOG_TAG:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      BASE_URL: ${BASE_URL:-}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      TZ: ${TZ:-Europe/Berlin}
      PHOTO_MODE: ${PHOTO_MODE:-upload}
      PHOTO_DIR: ${PHOTO_DIR:-/data/photos}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      # backups, thumbnails, downloaded import files and uploaded photos
      - ./data/app:/data
      # Photo folder. PHOTO_MODE=upload: defaults to ./data/app/photos.
      # PHOTO_MODE=nas: set PHOTO_HOST_DIR to your archive and PHOTO_MOUNT_OPTS=:ro in .env.
      - ${PHOTO_HOST_DIR:-./data/app/photos}:${PHOTO_DIR:-/data/photos}${PHOTO_MOUNT_OPTS:-}
    ports:
      - "${APP_PORT:-8090}:8000"
